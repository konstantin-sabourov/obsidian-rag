[project]
name = "obsidian-rag"
version = "0.1.0"
description = "Local RAG pipeline over an Obsidian vault via Ollama"
requires-python = ">=3.11"
dependencies = [
    # LlamaIndex core + integrations
    "llama-index-core>=0.12",
    "llama-index-readers-obsidian>=0.3",
    "llama-index-embeddings-ollama>=0.5",
    "llama-index-llms-ollama>=0.5",
    # Vector store
    "chromadb>=0.6",
    # Config
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    # CLI + UX
    "typer>=0.12",
    "rich>=13.0",
    # Logging
    "loguru>=0.7",
    "pytest>=9.0.3",
]

[project.scripts]
obsidian-rag = "obsidian_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_rag"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
